<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Browser Arcade</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
    header { max-width: 1100px; margin: 0 auto 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    h1 { margin: 0 auto 0 0; color: #58a6ff; font-size: 1.5rem; }
    input, select, button { padding: 8px 12px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #fff; }
    button { background: #238636; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #2ea043; }
    #player { max-width: 1100px; margin: 0 auto 24px; display: none; background: #161b22; padding: 12px; border-radius: 8px; border: 1px solid #30363d; }
    iframe { width: 100%; height: 550px; border: none; border-radius: 6px; background: #000; }
    .grid { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
    .card h3 { margin: 0 0 6px; font-size: 1.1rem; color: #fff; }
    .badge { display: inline-block; font-size: 0.75rem; background: #30363d; color: #58a6ff; padding: 2px 8px; border-radius: 12px; margin-bottom: 10px; width: fit-content; }
    .card p { font-size: 0.9rem; color: #8b949e; flex-grow: 1; margin-top: 0; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions a { color: #58a6ff; text-decoration: none; font-size: 0.85rem; align-self: center; margin-left: auto; }
  </style>
</head>
<body>
  <header>
    <h1>My Browser Arcade</h1>
    <select id="category" onchange="render()">
      <option value="all">All Categories</option>
      <option value="Puzzle">Puzzle</option>
      <option value="Arcade">Arcade</option>
      <option value="Action">Action</option>
    </select>
    <input id="search" type="text" placeholder="Search games..." oninput="render()" />
  </header>

  <div id="player">
    <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
      <strong id="nowPlaying">Playing</strong>
      <div>
        <a id="newTabLink" href="#" target="_blank" style="color:#58a6ff; margin-right:12px;">Open in New Tab ↗</a>
        <button onclick="closePlayer()" style="background:#da3633;">Close</button>
      </div>
    </div>
    <iframe id="gameFrame" src=""></iframe>
  </div>

  <div id="grid" class="grid"></div>

  <script>
    // ==========================================
    // ADD YOUR GAMES HERE!
    // Copy and paste a { ... }, block to add more.
    // ==========================================
    const GAMES = [
      {
        name: "2048",
        category: "Puzzle",
        description: "Slide numbered tiles on a grid to combine them and create a tile with the number 2048.",
        playUrl: "https://play2048.co",
        repoUrl: "https://github.com"
      },
      {
        name: "Hextris",
        category: "Puzzle",
        description: "Fast-paced puzzle game inspired by Tetris where you rotate a hexagon to match falling colors.",
        playUrl: "https://hextris.io",
        repoUrl: "https://github.com"
      },
      {
        name: "Astray",
        category: "Arcade",
        description: "3D WebGL maze game built with Three.js and Box2D.",
        playUrl: "https://github.io",
        repoUrl: "https://github.com"
      },
      {
        name: "Clumsy Bird",
        category: "Arcade",
        description: "Open-source Flappy Bird clone built with MelonJS.",
        playUrl: "https://github.io",
        repoUrl: "https://github.com"
      },
      {
        name: "BrowserQuest",
        category: "Action",
        description: "Classic HTML5 multiplayer adventure RPG created by Mozilla.",
        playUrl: "https://herokuapp.com",
        repoUrl: "https://github.com"
      },
      {
        name: "Tower Building",
        category: "Arcade",
        description: "Stack swinging tower blocks as high as possible with precise timing.",
        playUrl: "https://github.io",
        repoUrl: "https://github.com"
      }
    ];

    function render() {
      const q = document.getElementById('search').value.toLowerCase();
      const cat = document.getElementById('category').value;
      const grid = document.getElementById('grid');

      const filtered = GAMES.filter(g => {
        const matchesSearch = g.name.toLowerCase().includes(q) || g.description.toLowerCase().includes(q);
        const matchesCat = cat === 'all' || g.category === cat;
        return matchesSearch && matchesCat;
      });

      grid.innerHTML = filtered.map((g, i) => `
        <div class="card">
          <div>
            <h3>${g.name}</h3>
            <span class="badge">${g.category}</span>
            <p>${g.description}</p>
          </div>
          <div class="actions">
            <button onclick="playByIndex(${i})">Play</button>
            ${g.repoUrl ? `<a href="${g.repoUrl}" target="_blank">Source ↗</a>` : ''}
          </div>
        </div>
      `).join('') || 'No games match your search.';

      window.currentFiltered = filtered;
    }

    function playByIndex(index) {
      const game = window.currentFiltered[index];
      if (!game) return;
      document.getElementById('nowPlaying').textContent = 'Playing: ' + game.name;
      document.getElementById('newTabLink').href = game.playUrl;
      document.getElementById('gameFrame').src = game.playUrl;
      document.getElementById('player').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closePlayer() {
      document.getElementById('gameFrame').src = '';
      document.getElementById('player').style.display = 'none';
    }

    // Load games immediately on page open
    render();
  </script>
</body>
</html>
