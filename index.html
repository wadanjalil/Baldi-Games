<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2 Player & Arcade Games</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, #1a0b2e 0%, #240e3d 100%);
      color: #ffffff;
      margin: 0;
      padding: 24px 16px 60px;
      min-height: 100vh;
    }
    .container { max-width: 1120px; margin: 0 auto; }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    h2 { font-size: 1.35rem; font-weight: 700; margin: 0; }
    .search-box {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 8px 14px;
      border-radius: 999px;
      outline: none;
      font-size: 0.9rem;
      width: 220px;
    }
    .search-box::placeholder { color: rgba(255, 255, 255, 0.55); }

    /* Active Game Player */
    #playerSection {
      display: none;
      background: #130722;
      border: 2px solid #4c2882;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 28px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    .player-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .btn {
      background: #7c3aed;
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .close-btn { background: #e11d48; }
    #gameStage {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 360px;
      padding: 10px 0;
    }
    canvas { background: #090312; border-radius: 12px; max-width: 100%; }

    /* Square Tile Grid */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 18px;
    }
    .tile {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      background: #2d1650;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .tile:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.55);
    }
    .tile svg { width: 100%; height: 100%; display: block; }
    .tile-label {
      position: absolute;
      inset: auto 0 0 0;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.88));
      padding: 22px 10px 10px;
      font-weight: 700;
      font-size: 0.9rem;
      text-align: center;
      opacity: 0;
      transition: opacity 0.18s ease;
    }
    .tile:hover .tile-label { opacity: 1; }

    /* Board Game Helpers */
    .ttt-board { display: grid; grid-template-columns: repeat(3, 95px); gap: 10px; }
    .ttt-cell {
      width: 95px; height: 95px; background: #271347; border-radius: 14px;
      font-size: 2.8rem; font-weight: 800; display: flex; align-items: center;
      justify-content: center; cursor: pointer; user-select: none;
    }
    .ttt-cell:hover { background: #361b61; }
    .mem-grid { display: grid; grid-template-columns: repeat(4, 72px); gap: 10px; }
    .mem-card {
      width: 72px; height: 72px; background: #3b1d6e; border-radius: 12px;
      font-size: 2rem; display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="playerSection">
      <div class="player-top">
        <strong id="playerTitle" style="font-size:1.15rem;">Playing</strong>
        <div style="display:flex; gap:8px;">
          <button class="btn" onclick="restartCurrent()">↻ Restart</button>
          <button class="btn close-btn" onclick="closeGame()">✕ Close</button>
        </div>
      </div>
      <div id="playerHint" style="color:#c4b5fd; font-size:0.9rem; margin-bottom:10px;"></div>
      <div id="gameStage"></div>
    </div>

    <div class="header-bar">
      <h2>2 Player & Arcade Games</h2>
      <input id="searchInput" class="search-box" type="text" placeholder="Filter games..." oninput="renderGrid()" />
    </div>

    <div id="gameGrid" class="game-grid"></div>
  </div>

  <script>
    const GAMES = [
      {
        id: 'ttt', title: 'Tic Tac Toe (2P)',
        hint: '2 Players: Click any square to place X or O',
        svg: `<svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#c98a4b"/><path d="M68 12v176M132 12v176M12 68h176M12 132h176" stroke="#7c4a1e" stroke-width="6"/><circle cx="40" cy="40" r="18" fill="none" stroke="#e11d48" stroke-width="9"/><path d="M84 84l32 32M116 84l-32 32" stroke="#16a34a" stroke-width="9" stroke-linecap="round"/><circle cx="160" cy="160" r="18" fill="none" stroke="#e11d48" stroke-width="9"/></svg>`
      },
      {
        id: 'pong2p', title: '2 Player Pong',
        hint: 'Player 1: W / S keys | Player 2: Up / Down Arrows',
        svg: `<svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#0284c7"/><line x1="100" y1="15" x2="100" y2="185" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-dasharray="10,10"/><rect x="22" y="55" width="14" height="65" rx="7" fill="#fff"/><rect x="164" y="85" width="14" height="65" rx="7" fill="#facc15"/><circle cx="105" cy="95" r="11" fill="#fff"/><text x="100" y="182" fill="#fff" font-size="18" font-weight="900" text-anchor="middle" font-family="sans-serif">2P PONG</text></svg>`
      },
      {
        id: 'connect4', title: '4 In A Row (2P)',
        hint: '2 Players: Click any column to drop Red or Yellow discs',
        svg: `<svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#1d4ed8"/><circle cx="48" cy="52" r="20" fill="#1e3a8a"/><circle cx="100" cy="52" r="20" fill="#1e3a8a"/><circle cx="152" cy="52" r="20" fill="#1e3a8a"/><circle cx="48" cy="102" r="20" fill="#ef4444"/><circle cx="100" cy="102" r="20" fill="#facc15"/><circle cx="152" cy="102" r="20" fill="#1e3a8a"/><circle cx="48" cy="152" r="20" fill="#facc15"/><circle cx="100" cy="152" r="20" fill="#ef4444"/><circle cx="152" cy="152" r="20" fill="#facc15"/></svg>`
      },
      {
        id: 'reaction', title: '2P Reaction Duel',
        hint: 'Wait for GREEN! Player 1 presses A | Player 2 presses L',
        svg: `<svg viewBox="0 0 200 200"><rect width="100" height="200" fill="#e11d48"/><rect x="100" width="100" height="200" fill="#2563eb"/><polygon points="105,45 78,105 102,105 92,158 126,95 102,95" fill="#facc15"/><text x="50" y="180" fill="#fff" font-size="16" font-weight="900" text-anchor="middle" font-family="sans-serif">P1 [A]</text><text x="150" y="180" fill="#fff" font-size="16" font-weight="900" text-anchor="middle" font-family="sans-serif">P2 [L]</text></svg>`
      },
      {
        id: 'tanks2p', title: '2P Tank Duel',
        hint: 'P1 (Red): A/D turn, W move, Space shoot | P2 (Blue): Left/Right, Up move, Enter shoot',
        svg: `<svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#334155"/><rect x="25" y="80" width="42" height="32" rx="6" fill="#ef4444"/><rect x="55" y="92" width="24" height="8" fill="#fca5a5"/><rect x="133" y="80" width="42" height="32" rx="6" fill="#38bdf8"/><rect x="121" y="92" width="24" height="8" fill="#bae6fd"/><text x="100" y="178" fill="#fff" font-size="18" font-weight="900" text-anchor="middle" font-family="sans-serif">2P TANKS</text></svg>`
      },
      {
        id: 'snake', title: 'Neon Snake',
        hint: 'Arrow Keys or W/A/S/D to eat the red apples',
        svg: `<svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#14532d"/><rect x="35" y="90" width="95" height="24" rx="12" fill="#4ade80"/><rect x="106" y="50" width="24" height="64" rx="12" fill="#22c55e"/><circle cx="155" cy="135" r="13" fill="#ef4444"/><text x="100" y="182" fill="#fff" font-size="18" font-weight="900" text-anchor="middle" font-family="sans-serif">SNAKE</text></svg>`
      },
      {
        id: 'flappy', title: 'Flappy Square',
        hint: 'Press Space, Up Arrow, or Click the game screen to flap!',
        svg: `<svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#38bdf8"/><rect x="125" y="0" width="32" height="65" fill="#22c55e"/><rect x="125" y="125" width="32" height="75" fill="#22c55e"/><rect x="48" y="82" width="34" height="34" rx="8" fill="#facc15"/><circle cx="72" cy="94" r="4" fill="#000"/><text x="100" y="184" fill="#fff" font-size="18" font-weight="900" text-anchor="middle" font-family="sans-serif">FLAPPY</text></svg>`
      },
      {
        id: 'breakout', title: 'Brick Breaker',
        hint: 'Left / Right Arrows or A / D to bounce the ball',
        svg: `<svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#1e1b4b"/><rect x="20" y="28" width="48" height="16" rx="4" fill="#f43f5e"/><rect x="76" y="28" width="48" height="16" rx="4" fill="#fb923c"/><rect x="132" y="28" width="48" height="16" rx="4" fill="#facc15"/><circle cx="105" cy="115" r="10" fill="#fff"/><rect x="65" y="160" width="70" height="12" rx="6" fill="#22c55e"/></svg>`
      },
      {
        id: 'dino', title: 'Cyber Runner',
        hint: 'Press Space, Up Arrow, or Click to jump over red spikes!',
        svg: `<svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#0f172a"/><rect x="0" y="145" width="200" height="55" fill="#1e293b"/><rect x="38" y="95" width="32" height="50" rx="6" fill="#a855f7"/><polygon points="135,145 150,110 165,145" fill="#ef4444"/><text x="100" y="182" fill="#fff" font-size="18" font-weight="900" text-anchor="middle" font-family="sans-serif">RUNNER</text></svg>`
      },
      {
        id: 'dodger', title: 'Meteor Dodge',
hint: 'Left / Right Arrows or A / D to dodge falling meteors',
svg: <svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#172554"/><circle cx="55" cy="55" r="16" fill="#f97316"/><circle cx="145" cy="85" r="18" fill="#ef4444"/><polygon points="100,135 82,172 118,172" fill="#38bdf8"/></svg>
},
{
id: 'memory', title: 'Emoji Match',
hint: 'Click two cards to find matching pairs!',
svg: <svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#4c1d95"/><rect x="26" y="26" width="66" height="66" rx="12" fill="#7c3aed"/><rect x="108" y="26" width="66" height="66" rx="12" fill="#ec4899"/><rect x="26" y="108" width="66" height="66" rx="12" fill="#ec4899"/><rect x="108" y="108" width="66" height="66" rx="12" fill="#7c3aed"/><text x="59" y="68" fill="#fff" font-size="28" text-anchor="middle">?</text><text x="141" y="150" fill="#fff" font-size="28" text-anchor="middle">?</text></svg>
},
{
id: 'clicker', title: 'Speed Clicker',
hint: 'Click the target as many times as you can in 10 seconds!',
svg: <svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#881337"/><circle cx="100" cy="95" r="52" fill="#fff"/><circle cx="100" cy="95" r="34" fill="#e11d48"/><circle cx="100" cy="95" r="15" fill="#facc15"/><text x="100" y="182" fill="#fff" font-size="17" font-weight="900" text-anchor="middle" font-family="sans-serif">10s CLICKER</text></svg>
}
];
let activeTimer = null;
let activeTimeout = null;
let currentGameId = null;
function renderGrid() {
const q = document.getElementById('searchInput').value.toLowerCase();
const grid = document.getElementById('gameGrid');
const filtered = GAMES.filter(g => g.title.toLowerCase().includes(q));
grid.innerHTML = filtered.map(g => <div class="tile" onclick="launchGame('${g.id}')"> ${g.svg} <div class="tile-label">${g.title}</div> </div>).join('');
}
function stopEverything() {
if (activeTimer) { clearInterval(activeTimer); activeTimer = null; }
if (activeTimeout) { clearTimeout(activeTimeout); activeTimeout = null; }
window.onkeydown = null;
window.onkeyup = null;
}
function closeGame() {
stopEverything();
currentGameId = null;
document.getElementById('playerSection').style.display = 'none';
document.getElementById('gameStage').innerHTML = '';
}
function restartCurrent() {
if (currentGameId) launchGame(currentGameId);
}
function launchGame(id) {
stopEverything();
currentGameId = id;
const game = GAMES.find(g => g.id === id);
if (!game) return;
document.getElementById('playerTitle').textContent = game.title;
document.getElementById('playerHint').textContent = game.hint;
document.getElementById('playerSection').style.display = 'block';
window.scrollTo({ top: 0, behavior: 'smooth' });
const stage = document.getElementById('gameStage');
const map = {
ttt: startTTT, pong2p: startPong2P, connect4: startConnect4,
reaction: startReaction, tanks2p: startTanks2P, snake: startSnake,
flappy: startFlappy, breakout: startBreakout, dino: startDino,
dodger: startDodger, memory: startMemory, clicker: startClicker
};
if (map[id]) mapid;
}
// 1. 2P TIC TAC TOE
function startTTT(stage) {
let board = Array(9).fill(''), turn = 'X', over = false;
const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function draw(msg) {
stage.innerHTML = <div><div style="margin-bottom:12px;font-weight:bold;font-size:1.1rem;">${msg || Player ${turn}'s Turn}</div> <div class="ttt-board">${board.map((v, i) => ${v}).join('')}</div></div>;
}
window.tttMove = i => {
if (over || board[i]) return;
board[i] = turn;
if (wins.some(w => w.every(idx => board[idx] === turn))) { over = true; return draw(Player ${turn} Wins!); }
if (!board.includes('')) { over = true; return draw("Draw Game!"); }
turn = turn === 'X' ? 'O' : 'X';
draw();
};
draw();
}
// 2. 2P PONG
function startPong2P(stage) {
stage.innerHTML = <canvas id="c" width="520" height="340"></canvas>;
const ctx = document.getElementById('c').getContext('2d');
let p1 = 130, p2 = 130, bx = 260, by = 170, vx = 4, vy = 3, s1 = 0, s2 = 0, keys = {};
window.onkeydown = e => { if(['ArrowUp','ArrowDown'].includes(e.key)) e.preventDefault(); keys[e.key] = true; };
window.onkeyup = e => { keys[e.key] = false; };
activeTimer = setInterval(() => {
if ((keys['w'] || keys['W']) && p1 > 0) p1 -= 6;
if ((keys['s'] || keys['S']) && p1 < 260) p1 += 6;
if (keys['ArrowUp'] && p2 > 0) p2 -= 6;
if (keys['ArrowDown'] && p2 < 260) p2 += 6;
bx += vx; by += vy;
if (by <= 0 || by >= 330) vy = -vy;
if (bx <= 24 && by >= p1 && by <= p1 + 80) vx = Math.abs(vx) + 0.25;
if (bx >= 486 && by >= p2 && by <= p2 + 80) vx = -(Math.abs(vx) + 0.25);
if (bx < 0) { s2++; bx = 260; by = 170; vx = 4; }
if (bx > 520) { s1++; bx = 260; by = 170; vx = -4; }
ctx.clearRect(0, 0, 520, 340);
ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif';
ctx.fillText(${s1}  :  ${s2}, 232, 32);
ctx.fillRect(14, p1, 10, 80);
ctx.fillStyle = '#facc15'; ctx.fillRect(496, p2, 10, 80);
ctx.fillStyle = '#38bdf8'; ctx.fillRect(bx, by, 10, 10);
}, 16);
}
// 3. 4 IN A ROW (2P)
function startConnect4(stage) {
let cols = 7, rows = 6, grid = Array.from({length: rows}, () => Array(cols).fill(0)), turn = 1, over = false;
function checkWin(p) {
for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
if (c+3<cols && grid[r][c]==p && grid[r][c+1]==p && grid[r][c+2]==p && grid[r][c+3]==p) return true;
if (r+3<rows && grid[r][c]==p && grid[r+1][c]==p && grid[r+2][c]==p && grid[r+3][c]==p) return true;
if (r+3<rows && c+3<cols && grid[r][c]==p && grid[r+1][c+1]==p && grid[r+2][c+2]==p && grid[r+3][c+3]==p) return true;
if (r-3>=0 && c+3<cols && grid[r][c]==p && grid[r-1][c+1]==p && grid[r-2][c+2]==p && grid[r-3][c+3]==p) return true;
}
return false;
}
function draw(msg) {
let html = <div style="background:#1d4ed8;padding:12px;border-radius:14px;display:inline-block;">;
for (let r = 0; r < rows; r++) {
html += <div style="display:flex;gap:8px;margin-bottom:${r<rows-1?'8px':'0'}">;
for (let c = 0; c < cols; c++) {
let color = grid[r][c] === 1 ? '#ef4444' : grid[r][c] === 2 ? '#facc15' : '#0f172a';
html += <div onclick="dropC4(${c})" style="width:40px;height:40px;border-radius:50%;background:${color};cursor:pointer;"></div>;
}
html += </div>;
}
stage.innerHTML = <div><div style="margin-bottom:10px;font-weight:bold;font-size:1.1rem;">${msg || ${turn===1?'Red':'Yellow'}'s Turn}</div>${html}</div></div>;
}
window.dropC4 = c => {
if (over) return;
for (let r = rows - 1; r >= 0; r--) {
if (!grid[r][c]) {
grid[r][c] = turn;
if (checkWin(turn)) { over = true; return draw(${turn===1?'Red':'Yellow'} Wins!); }
turn = turn === 1 ? 2 : 1;
return draw();
}
}
};
draw();
}
// 4. 2P REACTION DUEL
function startReaction(stage) {
let ready = false, done = false;
stage.innerHTML = <div id="rxBox" style="width:420px;height:240px;border-radius:16px;background:#e11d48;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;padding:16px;">WAIT FOR GREEN...</div>;
activeTimeout = setTimeout(() => {
ready = true;
const box = document.getElementById('rxBox');
if (box) { box.style.background = '#16a34a'; box.textContent = 'PRESS [A] OR [L] NOW!'; }
}, 1500 + Math.random() * 2500);
window.onkeydown = e => {
if (done) return;
const k = e.key.toLowerCase();
if (k !== 'a' && k !== 'l') return;
done = true; clearTimeout(activeTimeout);
const box = document.getElementById('rxBox');
if (!ready) box.textContent = ${k === 'a' ? 'Player 1' : 'Player 2'} jumped early! Other player wins!;
else box.textContent = ${k === 'a' ? 'Player 1 [A]' : 'Player 2 [L]'} WINS!;
};
}
// 5. 2P TANK DUEL
function startTanks2P(stage) {
stage.innerHTML = <canvas id="c" width="520" height="340"></canvas>;
const ctx = document.getElementById('c').getContext('2d');
let t1 = { x: 80, y: 170, a: 0, hp: 3, c: '#ef4444' };
let t2 = { x: 440, y: 170, a: Math.PI, hp: 3, c: '#38bdf8' };
let bullets = [], keys = {};
window.onkeydown = e => {
if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
if (!keys[e.key]) {
if (e.key === ' ') bullets.push({ x: t1.x + Math.cos(t1.a)*18, y: t1.y + Math.sin(t1.a)*18, vx: Math.cos(t1.a)*6, vy: Math.sin(t1.a)*6, owner: 1 });
if (e.key === 'Enter') bullets.push({ x: t2.x + Math.cos(t2.a)*18, y: t2.y + Math.sin(t2.a)*18, vx: Math.cos(t2.a)*6, vy: Math.sin(t2.a)*6, owner: 2 });
}
keys[e.key] = true;
};
window.onkeyup = e => { keys[e.key] = false; };
activeTimer = setInterval(() => {
if (keys['a'] || keys['A']) t1.a -= 0.07;
if (keys['d'] || keys['D']) t1.a += 0.07;
if (keys['w'] || keys['W']) { t1.x = Math.max(20, Math.min(500, t1.x + Math.cos(t1.a)*3)); t1.y = Math.max(20, Math.min(320, t1.y + Math.sin(t1.a)*3)); }
if (keys['ArrowLeft']) t2.a -= 0.07;
if (keys['ArrowRight']) t2.a += 0.07;
if (keys['ArrowUp']) { t2.x = Math.max(20, Math.min(500, t2.x + Math.cos(t2.a)*3)); t2.y = Math.max(20, Math.min(320, t2.y + Math.sin(t2.a)3)); }
ctx.clearRect(0, 0, 520, 340);
ctx.fillStyle = '#475569'; ctx.fillRect(245, 95, 30, 150);
[t1, t2].forEach(t => {ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(t.a);
ctx.fillStyle = t.c; ctx.fillRect(-14, -12, 28, 24);
ctx.fillStyle = '#fff'; ctx.fillRect(0, -3, 20, 6);
ctx.restore();
});
bullets.forEach(b => {
b.x += b.vx; b.y += b.vy;
if (b.x > 245 && b.x < 275 && b.y > 95 && b.y < 245) b.dead = true;
if (b.owner === 1 && Math.hypot(b.x - t2.x, b.y - t2.y) < 16) { t2.hp--; b.dead = true; }
if (b.owner === 2 && Math.hypot(b.x - t1.x, b.y - t1.y) < 16) { t1.hp--; b.dead = true; }
ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI2); ctx.fill();
});
bullets = bullets.filter(b => !b.dead && b.x > 0 && b.x < 520 && b.y > 0 && b.y < 340);
document.getElementById('playerTitle').textContent = 2P Tank Duel — Red HP: ${t1.hp} | Blue HP: ${t2.hp};
if (t1.hp <= 0 || t2.hp <= 0) {
document.getElementById('playerTitle').textContent = t1.hp <= 0 ? 'Blue Tank Wins!' : 'Red Tank Wins!';
clearInterval(activeTimer);
}
}, 16);
}
// 6. NEON SNAKE
function startSnake(stage) {
stage.innerHTML = <canvas id="c" width="480" height="340"></canvas>;
const ctx = document.getElementById('c').getContext('2d');
let box = 20, snake = [{x: 200, y: 160}], dir = 'RIGHT', score = 0;
let food = { x: 100, y: 100 };
window.onkeydown = e => {
if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
if ((e.key === 'ArrowLeft' || e.key === 'a') && dir !== 'RIGHT') dir = 'LEFT';
if ((e.key === 'ArrowUp' || e.key === 'w') && dir !== 'DOWN') dir = 'UP';
if ((e.key === 'ArrowRight' || e.key === 'd') && dir !== 'LEFT') dir = 'RIGHT';
if ((e.key === 'ArrowDown' || e.key === 's') && dir !== 'UP') dir = 'DOWN';
};
activeTimer = setInterval(() => {
ctx.clearRect(0, 0, 480, 340);
ctx.fillStyle = '#ef4444'; ctx.fillRect(food.x, food.y, box, box);
snake.forEach((s, i) => { ctx.fillStyle = i ? '#22c55e' : '#4ade80'; ctx.fillRect(s.x, s.y, box-1, box-1); });
let h = { x: snake[0].x, y: snake[0].y };
if (dir === 'LEFT') h.x -= box; if (dir === 'UP') h.y -= box;
if (dir === 'RIGHT') h.x += box; if (dir === 'DOWN') h.y += box;
if (h.x === food.x && h.y === food.y) {
score++;
food = { x: Math.floor(Math.random()*23)*box, y: Math.floor(Math.random()*16)*box };
} else snake.pop();
if (h.x < 0 || h.x >= 480 || h.y < 0 || h.y >= 340 || snake.some(s => s.x === h.x && s.y === h.y)) {
document.getElementById('playerTitle').textContent = Snake — Game Over! Score: ${score};
return clearInterval(activeTimer);
}
snake.unshift(h);
document.getElementById('playerTitle').textContent = Neon Snake — Score: ${score};
}, 95);
}

// 11. EMOJI MEMORY MATCH
function startMemory(stage) {
const icons = ['🚀','🎮','🔥','⚡','💎','👾','🏆','🎯'];
let deck = [...icons, ...icons].sort(() => Math.random() - 0.5);
let flipped = [], matched = [];
function draw() {
stage.innerHTML = <div class="mem-grid">${deck.map((em, i) => { const open = flipped.includes(i) || matched.includes(i); return ${open ? em : '❓'}; }).join('')}</div>;
}
window.flipMem = i => {
if (flipped.length === 2 || flipped.includes(i) || matched.includes(i)) return;
flipped.push(i); draw();
if (flipped.length === 2) {
const [a, b] = flipped;
if (deck[a] === deck[b]) {
matched.push(a, b); flipped = []; draw();
if (matched.length === deck.length) document.getElementById('playerTitle').textContent = 'Emoji Match — You Matched All Pairs!';
} else {
activeTimeout = setTimeout(() => { flipped = []; draw(); }, 650);
}
}
};
draw();
}
